<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Videojuego</title>
    <link rel="stylesheet" href="/Asking_APP/style.css">
    <link rel="manifest" href="/Asking_APP/manifest.json">
    <script type="module" src="/Asking_APP/script.js"></script>

    <style>
        /* Estilos para la pantalla Splash */
        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #03203f; /* Color de fondo */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999; /* Asegura que esté al frente */
        }

        #splash img {
            width: 150px; /* Tamaño del logo */
        }

        /* Estilo de la tabla */
        #tabla-puntuaciones {
            width: 60%;
            margin: 20px auto;
            border-collapse: collapse;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }

        #tabla-puntuaciones th, #tabla-puntuaciones td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
            color: black;
            font-size: 16px;
        }

        #tabla-puntuaciones th {
            background-color: #03203f;
            color: rgb(240, 230, 230);
            font-size: 18px;
        }

        #tabla-puntuaciones tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        /* Estilos generales */
        body {
            font-family: Arial, sans-serif;
        }

        .btn-container {
            margin: 20px;
            text-align: center;
        }

        .btn-container a button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- Pantalla Splash -->
    <div id="splash">
        <img src="/Asking_APP/images/icon-192.png" alt="Logo del juego">
    </div>

    <header>
        <h1>Videojuego Asking</h1>
        <p>¡Descarga y juega ahora!</p>
    </header>
    
    <main>
        <img src="/Asking_APP/images/game-preview.jpg"><br>

        <div class="btn-container">
             <!-- Audio que se va a reproducir -->
<audio id="sonidoClick" src="/Asking_APP/click.mp3" preload="auto"></audio>

<!-- Botón de descarga con sonido -->
<a href="/Asking_APP/app-debug.apk" download="/Asking_APP/app-debug.apk">
    <button id="btnDescargar">📱 Descargar APK</button>
</a>

<script>
    const botonDescarga = document.getElementById('btnDescargar');
    const sonidoClick = document.getElementById('sonidoClick');

    botonDescarga.addEventListener('click', () => {
        sonidoClick.currentTime = 0; // Reinicia el audio si ya estaba sonando
        sonidoClick.play(); // Reproduce el sonido
    });
</script>

        </div>


        <p>Versión 1.0 | Compatible con Android</p>
    </main>
    
    <table id="tabla-puntuaciones" border="1">
        <tr>
            <th>Usuario</th>
            <th>Puntuación</th>
        </tr>
    </table>
    
    <footer>
        <p>© 2025 Mi Videojuego. Todos los derechos reservados.</p>
    </footer>

    <script>
        // Ocultar la pantalla splash después de 2 segundos
        window.addEventListener("load", () => {
            setTimeout(() => {
                document.getElementById("splash").style.display = "none";
            }, 2000); // Oculta después de 2 segundos
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker registrado:', reg))
                .catch(err => console.error('Error al registrar Service Worker:', err));
        }
    </script>

    <script type="module" src="script.js"></script>

</body>
</html>
